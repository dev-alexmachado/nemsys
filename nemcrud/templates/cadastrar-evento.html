{% extends 'base.html' %}
{% block title %}NEMSYS | Cadastrar Evento{% endblock %}
{% block content %}
<form method="POST" action="{% url 'cadastrar_evento' %}" class="mt-5 mb-5">
    {% csrf_token %}
    <div class="row">
        <div class="col-12 mb-3">
            <label for="nome" class="form-label">Nome do evento:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
        </div>
        <div class="col-12 col-md-4 col-lg-2 mb-3">
            <label for="lotacao" class="form-label">Lotação do evento:</label>
            <input type="number" id="lotacao" name="lotacao" class="form-control">
        </div>
        <div class="col-12 col-md-4 col-lg-2 mb-3">
            <label for="dia" class="form-label">Dia do evento:</label>
            <input type="date" id="dia" name="dia" class="form-control" required>
        </div>
        <div class="col-12 col-md-4 col-lg-2 mb-3">
            <label for="dia" class="form-label">Hora do evento:</label>
            <input type="time" id="dia" name="dia" class="form-control" required>
        </div>
        <div class="col-12 col-md-6 col-lg-2 mb-3">
            <label for="ingresso" class="form-label">Preço do ingresso:</label>
            <input type="number" placeholder="R$ 0,00" step="0.01" id="ingresso" name="ingresso" class="form-control">
        </div>
        <div class="col-12 col-md-6 col-lg-4 mb-3">
            <label for="telefone" class="form-label">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" class="form-control">
        </div>
        <div class="col-12 mb-3">
            <label for="endereco" class="form-label">Endereço:</label>
            <input type="text" id="endereco" name="endereco" class="form-control">
        </div>
        <div class="d-flex justify-content-center mt-3 mb-5">
            <button type="submit" class="btn btn-success">Cadastrar</button>
        </div>
    </div>
</form>
{% endblock %}
